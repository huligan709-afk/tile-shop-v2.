<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка — Всё для плиточника</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#172638;margin:0}.wrap{max-width:1000px;margin:auto;padding:25px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.box{background:white;border:1px solid #e2e7ec;border-radius:18px;padding:18px;margin:15px 0}input,textarea,select{padding:11px;border:1px solid #dce2e8;border-radius:10px;width:100%;box-sizing:border-box;margin:5px 0 12px}button{padding:10px 14px;border:0;border-radius:10px;background:#1683f5;color:white;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.muted{color:#7d8997}</style></head><body><div class="wrap"><h1>🧱 Админ-панель</h1><div class="box"><label>ADMIN_KEY</label><input id="key" type="password" placeholder="Введите ключ"><button onclick="loadAll()">Войти</button><span id="msg" class="muted"></span></div><div id="content"></div></div><script>let key='';async function api(u,o={}){o.headers={...(o.headers||{}),'x-admin-key':key,'Content-Type':'application/json'};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}async function loadAll(){key=document.getElementById('key').value;try{let [p,o]=await Promise.all([api('/api/products'),api('/api/orders')]);document.getElementById('content').innerHTML='<div class="box"><h2>Заказы</h2>'+(!o.length?'<p class="muted">Заказов пока нет</p>':'<table><tr><th>№</th><th>Клиент</th><th>Телефон</th><th>Сумма</th><th>Статус</th></tr>'+o.map(x=>`<tr><td>${x.id}</td><td>${x.customer_name}</td><td>${x.phone}</td><td>${x.total} ₽</td><td><select onchange="status(${x.id},this.value)">${['Новый','Принят','В работе','Готов','Выполнен','Отменён'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</table>')+'</div><div class="box"><h2>Товары</h2><p class="muted">Товаров: '+p.length+'</p><table><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th>Остаток</th></tr>'+p.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.category}</td><td>${x.price} ₽</td><td>${x.stock}</td></tr>`).join('')+'</table></div>'}catch(e){document.getElementById('msg').textContent=e.message}}async function status(id,status){try{await api('/api/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})})}catch(e){alert(e.message)}}</script></body></html>
